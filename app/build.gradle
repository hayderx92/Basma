plugins { id 'com.android.application' }
android {
    namespace 'com.hayder.masareef'
    compileSdk 35
    defaultConfig {
        applicationId "com.hayder.masareef"
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName "1.1"
    }
    signingConfigs {
        fixed { storeFile file('masareef.jks'); storePassword 'masareef123'; keyAlias 'masareef'; keyPassword 'masareef123' }
    }
    buildTypes { debug { signingConfig signingConfigs.fixed } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
