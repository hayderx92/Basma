<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>فاتورة مبيعات</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top"><h1 id="ttl">فاتورة جديدة</h1></header>
<main id="view"></main>
<nav id="nav">
  <button data-v="edit" class="on"><span>🧾</span>فاتورة</button>
  <button data-v="items"><span>📦</span>المواد</button>
  <button data-v="saved"><span>🗂️</span>المحفوظة</button>
  <button data-v="settings"><span>⚙️</span>الإعدادات</button>
</nav>
<div id="sheet" class="hide"><div class="sbox" id="sbox"></div></div>
<div id="preview" class="hide">
  <div class="pbar">
    <button class="btn" id="pv-close">✕ إغلاق</button>
    <button class="btn" id="pv-print">🖨️ طباعة</button>
    <button class="btn pri" id="pv-pdf">⬇️ PDF</button>
  </div>
  <div id="pv-wrap"><div id="pv-pages"></div></div>
</div>
<div id="toast"></div>
<script src="invoice.js"></script>
<script src="app.js"></script>
</body>
</html>
