name: Build Invoice APK

on:
  push:
    branches: [ invoice-app ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        id: b
        continue-on-error: true
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish result to invoice-app-build branch
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/ || true
          cp app/build/outputs/apk/release/*.apk /tmp/out/invoice.apk 2>/dev/null || true
          echo "${{ steps.b.outcome }} ${{ github.sha }}" > /tmp/out/STATUS
          cd /tmp/out
          git init -q -b invoice-app-build
          git config user.name ci; git config user.email ci@example.com
          git add -A; git commit -qm "build ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" invoice-app-build
      - uses: actions/upload-artifact@v4
        with:
          name: invoice-apk
          path: app/build/outputs/apk/release/*.apk
