name: Build APK
on:
  push:
    branches: [ iran-trip ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Masareef-Iran.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Masareef-Iran-apk
          path: Masareef-Iran.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: iran-trip-v${{ github.run_number }}
          name: مصاريف سفرة إيران v${{ github.run_number }}
          files: Masareef-Iran.apk
